[package]
name = "assistant-mcp"
description = "Knowledge-graph memory server for AI tools via MCP (stdio + streamable HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "advisaur-mcp"
path = "src/main.rs"

[dependencies]
assistant-integrations = { version = "0.4.0", path = "../assistant-integrations" }
assistant-memory = { version = "0.4.0", path = "../assistant-memory" }
axum = "0.8"
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
uuid.workspace = true
jsonschema = { version = "0.50", default-features = false }
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
