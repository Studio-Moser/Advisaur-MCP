name: Memory evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: memory-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Deterministic PR gate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Detect memory-impacting changes
        id: changes
        shell: bash
        run: |
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              Cargo.lock | Cargo.toml | \
              crates/assistant-memory/* | crates/assistant-mcp/* | crates/assistant-memory-eval/* | \
              tests/fixtures/Contract\ Corpus-v1.json | \
              tests/fixtures/LongMemEval\ PR-v1.json | \
              tests/fixtures/Memory\ Eval\ Policy-v1.json | \
              .github/workflows/memory-eval.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git -C candidate diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - name: Check out base
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Use stable Rust
        if: steps.changes.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Detect base evaluator
        if: steps.changes.outputs.relevant == 'true'
        id: base-evaluator
        shell: bash
        run: |
          if git -C base cat-file -e HEAD:crates/assistant-memory-eval/Cargo.toml 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          # A base from before ADR-0012 has the evaluator under its old name; the rename's own PR
          # is compared with it by the renamed-evaluation gate below.
          if git -C base cat-file -e HEAD:crates/shelby-memory-eval/Cargo.toml 2>/dev/null; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect evaluation-oracle changes
        if: steps.changes.outputs.relevant == 'true' && steps.base-evaluator.outputs.available == 'true'
        id: oracle-changes
        shell: bash
        run: |
          if git -C candidate diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" -- \
            crates/assistant-memory-eval \
            "tests/fixtures/Contract Corpus-v1.json" \
            "tests/fixtures/LongMemEval PR-v1.json" \
            "tests/fixtures/Memory Eval Policy-v1.json" \
            .github/workflows/memory-eval.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare base-owned evaluation oracle
        if: steps.changes.outputs.relevant == 'true'
        id: oracle
        shell: bash
        run: |
          git clone --local --no-hardlinks candidate candidate-evaluated
          if [ "${{ steps.base-evaluator.outputs.available }}" = "true" ]; then
            rm -rf candidate-evaluated/crates/assistant-memory-eval
            cp -R base/crates/assistant-memory-eval candidate-evaluated/crates/assistant-memory-eval
            cp "base/tests/fixtures/Contract Corpus-v1.json" "candidate-evaluated/tests/fixtures/Contract Corpus-v1.json"
            cp "base/tests/fixtures/LongMemEval PR-v1.json" "candidate-evaluated/tests/fixtures/LongMemEval PR-v1.json"
            cp "base/tests/fixtures/Memory Eval Policy-v1.json" "candidate-evaluated/tests/fixtures/Memory Eval Policy-v1.json"
            echo "candidate_manifest=candidate-evaluated/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "oracle_manifest=base/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "dataset_manifest=base/tests/fixtures/LongMemEval PR-v1.json" >> "$GITHUB_OUTPUT"
            echo "policy=base/tests/fixtures/Memory Eval Policy-v1.json" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_manifest=candidate-evaluated/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "oracle_manifest=candidate/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "dataset_manifest=candidate/tests/fixtures/LongMemEval PR-v1.json" >> "$GITHUB_OUTPUT"
            echo "policy=candidate/tests/fixtures/Memory Eval Policy-v1.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust builds
        if: steps.changes.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate -> target
            candidate-evaluated -> target
            base -> target

      - name: Cache pinned public datasets
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: .memory-eval-cache
          key: memory-eval-${{ runner.os }}-${{ hashFiles('candidate/tests/fixtures/LongMemEval PR-v1.json', 'base/tests/fixtures/LongMemEval PR-v1.json') }}

      - name: Fetch and verify candidate dataset
        if: steps.changes.outputs.relevant == 'true'
        id: candidate-dataset
        shell: bash
        run: |
          mkdir -p .memory-eval-cache artifacts
          checksum=$(jq -r '.dataset.sha256' "${{ steps.oracle.outputs.dataset_manifest }}")
          dataset=".memory-eval-cache/$checksum.json"
          cargo run --locked --manifest-path "${{ steps.oracle.outputs.oracle_manifest }}" -p assistant-memory-eval -- \
            fetch longmemeval-pr --cache "$dataset"
          echo "path=$dataset" >> "$GITHUB_OUTPUT"

      - name: Run candidate twice
        if: steps.changes.outputs.relevant == 'true'
        run: |
          cargo run --locked --manifest-path "${{ steps.oracle.outputs.candidate_manifest }}" -p assistant-memory-eval -- \
            run --suite pr --dataset "${{ steps.candidate-dataset.outputs.path }}" \
            --policy "${{ steps.oracle.outputs.policy }}" \
            --output artifacts/candidate --code-sha "${{ github.event.pull_request.head.sha }}" \
            > artifacts/candidate.log 2>&1
          cargo run --locked --manifest-path "${{ steps.oracle.outputs.candidate_manifest }}" -p assistant-memory-eval -- \
            run --suite pr --dataset "${{ steps.candidate-dataset.outputs.path }}" \
            --policy "${{ steps.oracle.outputs.policy }}" \
            --output artifacts/candidate-repeat --code-sha "${{ github.event.pull_request.head.sha }}" \
            > artifacts/candidate-repeat.log 2>&1

      - name: Compare with a base under its pre-rename evaluator
        if: steps.changes.outputs.relevant == 'true' && steps.base-evaluator.outputs.legacy == 'true'
        shell: bash
        run: |
          checksum=$(jq -r '.dataset.sha256' "base/tests/fixtures/LongMemEval PR-v1.json")
          dataset=".memory-eval-cache/$checksum.json"
          cargo run --locked --manifest-path base/Cargo.toml -p shelby-memory-eval -- \
            fetch longmemeval-pr --cache "$dataset"
          cargo run --locked --manifest-path base/Cargo.toml -p shelby-memory-eval -- \
            run --suite pr --dataset "$dataset" \
            --policy "base/tests/fixtures/Memory Eval Policy-v1.json" \
            --output artifacts/legacy-base --code-sha "${{ github.event.pull_request.base.sha }}" \
            > artifacts/legacy-base.log 2>&1
          node "candidate/scripts/Compare Renamed Evaluation.mjs" \
            --base artifacts/legacy-base/results.json --candidate artifacts/candidate/results.json

      - name: Run base
        if: steps.changes.outputs.relevant == 'true' && steps.base-evaluator.outputs.available == 'true'
        shell: bash
        run: |
          checksum=$(jq -r '.dataset.sha256' "base/tests/fixtures/LongMemEval PR-v1.json")
          dataset=".memory-eval-cache/$checksum.json"
          cargo run --locked --manifest-path base/Cargo.toml -p assistant-memory-eval -- \
            fetch longmemeval-pr --cache "$dataset"
          cargo run --locked --manifest-path base/Cargo.toml -p assistant-memory-eval -- \
            run --suite pr --dataset "$dataset" \
            --policy "${{ steps.oracle.outputs.policy }}" \
            --output artifacts/base --code-sha "${{ github.event.pull_request.base.sha }}" \
            > artifacts/base.log 2>&1

      - name: Bootstrap base for the evaluator's first merge
        if: steps.changes.outputs.relevant == 'true' && steps.base-evaluator.outputs.available == 'false'
        run: |
          mkdir -p artifacts/base
          cp artifacts/candidate/results.json artifacts/base/results.json
          cp artifacts/candidate/report.md artifacts/base/report.md
          echo "Base does not yet contain the evaluator; candidate policy floors are the bootstrap gate." \
            > artifacts/base/BOOTSTRAP.txt

      - name: Compare base and candidate
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path "${{ steps.oracle.outputs.oracle_manifest }}" -p assistant-memory-eval -- \
            compare --base artifacts/base/results.json \
            --candidate artifacts/candidate/results.json \
            --candidate-repeat artifacts/candidate-repeat/results.json \
            --policy "${{ steps.oracle.outputs.policy }}" \
            --output artifacts/comparison
          status=$?
          if [ -f artifacts/comparison/comparison.md ]; then
            cat artifacts/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Fetch approved rebaseline dataset
        if: >-
          steps.changes.outputs.relevant == 'true' &&
          steps.base-evaluator.outputs.available == 'true' &&
          steps.oracle-changes.outputs.changed == 'true' &&
          contains(github.event.pull_request.labels.*.name, 'memory-eval/rebaseline-approved')
        id: rebaseline-dataset
        shell: bash
        run: |
          checksum=$(jq -r '.dataset.sha256' "candidate/tests/fixtures/LongMemEval PR-v1.json")
          dataset=".memory-eval-cache/$checksum.json"
          cargo run --locked --manifest-path candidate/Cargo.toml -p assistant-memory-eval -- \
            fetch longmemeval-pr --cache "$dataset"
          echo "path=$dataset" >> "$GITHUB_OUTPUT"

      - name: Run approved candidate rebaseline twice
        if: >-
          steps.changes.outputs.relevant == 'true' &&
          steps.base-evaluator.outputs.available == 'true' &&
          steps.oracle-changes.outputs.changed == 'true' &&
          contains(github.event.pull_request.labels.*.name, 'memory-eval/rebaseline-approved')
        run: |
          cargo run --locked --manifest-path candidate/Cargo.toml -p assistant-memory-eval -- \
            run --suite pr --dataset "${{ steps.rebaseline-dataset.outputs.path }}" \
            --policy "candidate/tests/fixtures/Memory Eval Policy-v1.json" \
            --output artifacts/rebaseline-candidate --code-sha "${{ github.event.pull_request.head.sha }}" \
            > artifacts/rebaseline-candidate.log 2>&1
          cargo run --locked --manifest-path candidate/Cargo.toml -p assistant-memory-eval -- \
            run --suite pr --dataset "${{ steps.rebaseline-dataset.outputs.path }}" \
            --policy "candidate/tests/fixtures/Memory Eval Policy-v1.json" \
            --output artifacts/rebaseline-candidate-repeat --code-sha "${{ github.event.pull_request.head.sha }}" \
            > artifacts/rebaseline-candidate-repeat.log 2>&1

      - name: Validate approved candidate rebaseline
        if: >-
          steps.changes.outputs.relevant == 'true' &&
          steps.base-evaluator.outputs.available == 'true' &&
          steps.oracle-changes.outputs.changed == 'true' &&
          contains(github.event.pull_request.labels.*.name, 'memory-eval/rebaseline-approved')
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path candidate/Cargo.toml -p assistant-memory-eval -- \
            compare --base artifacts/rebaseline-candidate/results.json \
            --candidate artifacts/rebaseline-candidate/results.json \
            --candidate-repeat artifacts/rebaseline-candidate-repeat/results.json \
            --policy "candidate/tests/fixtures/Memory Eval Policy-v1.json" \
            --output artifacts/rebaseline-comparison
          status=$?
          if [ -f artifacts/rebaseline-comparison/comparison.md ]; then
            cat artifacts/rebaseline-comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload evaluation evidence
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: memory-evaluation
          path: artifacts/
          if-no-files-found: error

      - name: Enforce explicit re-baseline approval
        if: >-
          always() &&
          steps.changes.outputs.relevant == 'true' &&
          steps.base-evaluator.outputs.available == 'true' &&
          steps.oracle-changes.outputs.changed == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'memory-eval/rebaseline-approved')
        shell: bash
        run: |
          echo "::error::Evaluation-oracle changes require the memory-eval/rebaseline-approved label from a maintainer."
          exit 1

      - name: Skip unrelated pull request
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No memory-impacting files changed."
