name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install package workspace
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test npm launcher and client packages
        run: npm test

      - name: Audit npm package graph
        run: npm audit

      - name: Build native server
        run: cargo build -p assistant-mcp

      - name: Verify installed npm package
        run: node "scripts/Verify Package.mjs" --binary target/debug/advisaur-mcp

      - name: Assemble client packages
        run: node "scripts/Build Integration Packages.mjs" --all --binary target/debug/advisaur-mcp

      - name: Verify release policy
        run: node "scripts/Verify Release Workflow.mjs"

      - name: Verify documentation links
        run: node "scripts/Check Documentation Links.mjs"
