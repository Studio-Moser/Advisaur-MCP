name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish already-verified 0.4.0 artifacts
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "v0.4.0"

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            platform: macos
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: macos
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            platform: windows

    steps:
      - uses: actions/checkout@v5

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test on the target architecture
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build -p assistant-mcp --release --locked --target ${{ matrix.target }}

      - name: Archive Unix binary and license
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p release-staging release-assets
          cp "target/${{ matrix.target }}/release/advisaur-mcp" release-staging/
          cp LICENSE release-staging/
          tar -C release-staging -czf "release-assets/shelby-mcp-${{ matrix.target }}.tar.gz" advisaur-mcp LICENSE
          if [ "${{ matrix.platform }}" = "macos" ]; then
            (cd release-assets && shasum -a 256 "shelby-mcp-${{ matrix.target }}.tar.gz" > "shelby-mcp-${{ matrix.target }}.tar.gz.sha256")
          else
            (cd release-assets && sha256sum "shelby-mcp-${{ matrix.target }}.tar.gz" > "shelby-mcp-${{ matrix.target }}.tar.gz.sha256")
          fi

      - name: Archive Windows binary and license
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-staging, release-assets | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/advisaur-mcp.exe" release-staging/
          Copy-Item LICENSE release-staging/
          Compress-Archive -Path release-staging/advisaur-mcp.exe, release-staging/LICENSE -DestinationPath "release-assets/shelby-mcp-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "release-assets/shelby-mcp-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  shelby-mcp-${{ matrix.target }}.zip" | Set-Content -NoNewline "release-assets/shelby-mcp-${{ matrix.target }}.zip.sha256"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  package:
    name: Assemble release packages
    needs: native
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: downloaded
          merge-multiple: true

      - name: Extract native binaries
        shell: bash
        run: |
          mkdir -p target/release-binaries
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            mkdir -p "target/release-binaries/$target"
            tar -xzf "downloaded/shelby-mcp-$target.tar.gz" -C "target/release-binaries/$target" advisaur-mcp
          done
          mkdir -p target/release-binaries/x86_64-pc-windows-msvc
          unzip -q downloaded/shelby-mcp-x86_64-pc-windows-msvc.zip advisaur-mcp.exe -d target/release-binaries/x86_64-pc-windows-msvc
          chmod +x target/release-binaries/*/advisaur-mcp

      - name: Install package tooling
        run: npm ci

      - name: Verify Rust crate packages
        run: |
          cargo package -p assistant-memory --locked
          cargo package -p assistant-integrations --locked

      - name: Build npm packages
        shell: bash
        run: |
          mkdir -p target/release-assets
          node "scripts/Build Native Packages.mjs" --target aarch64-apple-darwin --binary target/release-binaries/aarch64-apple-darwin/advisaur-mcp --output target/release-assets
          node "scripts/Build Native Packages.mjs" --target x86_64-apple-darwin --binary target/release-binaries/x86_64-apple-darwin/advisaur-mcp --output target/release-assets
          node "scripts/Build Native Packages.mjs" --target aarch64-unknown-linux-gnu --binary target/release-binaries/aarch64-unknown-linux-gnu/advisaur-mcp --output target/release-assets
          node "scripts/Build Native Packages.mjs" --target x86_64-unknown-linux-gnu --binary target/release-binaries/x86_64-unknown-linux-gnu/advisaur-mcp --output target/release-assets
          node "scripts/Build Native Packages.mjs" --target x86_64-pc-windows-msvc --binary target/release-binaries/x86_64-pc-windows-msvc/advisaur-mcp.exe --output target/release-assets
          npm pack . --pack-destination target/release-assets

      - name: Verify npm and integration packages
        run: |
          node "scripts/Verify Package.mjs" --binary target/release-binaries/x86_64-unknown-linux-gnu/advisaur-mcp
          node "scripts/Build Integration Packages.mjs" --all \
            --mcpb aarch64-apple-darwin=target/release-binaries/aarch64-apple-darwin/advisaur-mcp \
            --mcpb x86_64-apple-darwin=target/release-binaries/x86_64-apple-darwin/advisaur-mcp \
            --mcpb aarch64-unknown-linux-gnu=target/release-binaries/aarch64-unknown-linux-gnu/advisaur-mcp \
            --mcpb x86_64-unknown-linux-gnu=target/release-binaries/x86_64-unknown-linux-gnu/advisaur-mcp \
            --mcpb x86_64-pc-windows-msvc=target/release-binaries/x86_64-pc-windows-msvc/advisaur-mcp.exe
          npm test
          npm audit

      - name: Archive client integrations
        shell: bash
        run: |
          for client in agent-plugin codex claude-code gemini antigravity devin; do
            (cd "target/integrations/$client" && zip -X -q -r "../../release-assets/shelbymcp-$client-0.4.0.zip" .)
          done
          cp target/integrations/*.mcpb target/release-assets/
          cp target/package/*.crate target/release-assets/
          cp downloaded/* target/release-assets/
          (cd target/release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload complete release
        uses: actions/upload-artifact@v7
        with:
          name: shelbymcp-release
          path: target/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish protected release
    needs: package
    if: inputs.publish == true && github.ref == 'refs/tags/v0.4.0'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download verified release
        uses: actions/download-artifact@v8
        with:
          name: shelbymcp-release
          path: target/release-assets

      - name: Publish platform packages before wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          for package in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            npm publish "target/release-assets/shelbymcp-$package-0.4.0.tgz" --access public --provenance
          done
          npm publish target/release-assets/shelbymcp-0.4.0.tgz --access public --provenance

      - name: Publish reusable Rust crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p assistant-memory --locked
          cargo publish -p assistant-integrations --locked

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" target/release-assets/* --verify-tag --generate-notes --latest
          fi
