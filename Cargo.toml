[workspace]
resolver = "3"
members = ["crates/assistant-integrations", "crates/assistant-memory", "crates/assistant-memory-eval", "crates/assistant-mcp"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Studio-Moser/Advisaur-MCP"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
